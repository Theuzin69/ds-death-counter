name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path src/version.h -Pattern '#define DSDC_VERSION_STRING "(.+)"').Matches[0].Groups[1].Value
          if (-not $v) { throw "DSDC_VERSION_STRING not found in src/version.h" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match src/version.h ($v)"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build app
        shell: cmd
        run: build.bat

      - name: Build tests
        shell: cmd
        run: tests\build_tests.bat

      - name: Run tests
        shell: cmd
        run: build\tests\boss_cause_test.exe

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q installer\DSDeathCounter.iss'

      - name: Package
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force release, "portable\DSDeathCounter-$v" | Out-Null
          Copy-Item "dist\DSDeathCounter-Setup-$v.exe" release\
          Copy-Item build\DSDeathCounter.exe, LICENSE, THIRD_PARTY_NOTICES.md "portable\DSDeathCounter-$v\"
          Compress-Archive -Path "portable\DSDeathCounter-$v\*" -DestinationPath "release\DSDeathCounter-$v-portable.zip"
          $sums = Get-ChildItem release -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          # LF line endings so `sha256sum -c` works too
          [IO.File]::WriteAllText("$PWD/release/SHA256SUMS.txt", ($sums -join "`n") + "`n")
          Get-Content release\SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: DSDeathCounter-${{ steps.version.outputs.version }}
          path: release/

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release/DSDeathCounter-Setup-*.exe
            release/DSDeathCounter-*-portable.zip
            build/DSDeathCounter.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "DS Death Counter $v" }
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $footer = Get-Content .github/release-notes-footer.md -Raw -Encoding utf8
          $footer = $footer.Replace('{{VERSION}}', $v).Replace('{{REPO}}', $env:GITHUB_REPOSITORY).Replace('{{RUN_URL}}', $runUrl)
          Set-Content release-notes.md "$notes`n`n$footer" -Encoding utf8
          $pre = if ($v.Contains('-')) { '--prerelease' } else { '--latest' }
          gh release create "v$v" (Get-ChildItem release -File).FullName --title "DS Death Counter $v" --notes-file release-notes.md --verify-tag $pre
